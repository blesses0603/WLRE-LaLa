name: LaLa Core Checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop button rendering dependency
        run: python -m pip install -r requirements-desktop.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q lala_core lala_desktop lala_android
      - name: Tkinter interface smoke test (Xvfb)
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_classic_desktop_smoke.py' -v
