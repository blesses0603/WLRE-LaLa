name: LaLa Core Checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop button rendering dependency
        run: python -m pip install -r requirements-desktop.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q lala_core lala_desktop lala_android
      - name: Tkinter interface smoke test (Xvfb)
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_classic_desktop_smoke.py' -v
      - name: Local planning UI interactive smoke test (Xvfb)
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_local_tools_smoke.py' -v
      - name: Read-only official resource UI smoke test (Xvfb, no network)
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_resource_ui_smoke.py' -v

  windows-bat-launcher:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        launcher: [automatic, py-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify automatic Python detection and environment bootstrap
        shell: cmd
        run: |
          if "${{ matrix.launcher }}"=="py-only" (
            call run_lala.bat --check --py-only
          ) else (
            call run_lala.bat --check
          )
      - name: Verify repeated startup reuses environment
        shell: cmd
        run: call run_lala.bat --check
      - name: Test dependency from isolated local environment
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s tests -p test_game_buttons.py -v

  windows-new-python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Pillow and desktop rendering with selected Python
        shell: cmd
        run: |
          python -m venv .venv
          call run_lala.bat --check
          .venv\Scripts\python.exe -m unittest discover -s tests -p test_game_buttons.py -v
