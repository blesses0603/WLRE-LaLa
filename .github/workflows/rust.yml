name: Rust 驗證
on:
  push:
  pull_request:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 單次低負載官方端點驗收；其他分支與 PR 事件不觸發。
      - if: github.event_name == 'push' && github.ref == 'refs/heads/codex/core-v0.2.0'
        run: cargo test -p wlre-resource-manager official_observed_index_smoke -- --ignored
      # 開發分支對單一官方二進位清單執行有限次驗收。
      - if: github.event_name == 'push' && github.ref == 'refs/heads/codex/core-v0.3.0'
        run: cargo test -p wlre-resource-manager official_binary_manifest_smoke -- --ignored
      # 單次觀察兩包快照，不下載遊戲封包。
      - if: github.event_name == 'push' && github.ref == 'refs/heads/codex/core-v0.3.0'
        run: cargo test -p wlre-resource-manager official_current_snapshot_smoke -- --ignored
      # 唯讀單一官方封包，驗證容器格式；不保存內容。
      - if: github.event_name == 'push' && github.ref == 'refs/heads/codex/core-v0.3.0'
        run: cargo test -p wlre-resource-manager official_unity_container_smoke -- --ignored
      # 單一封包下載及快取驗收，資料僅存工作執行器暫存目錄。
      - if: github.event_name == 'push' && github.ref == 'refs/heads/codex/core-v0.3.0'
        run: cargo test -p wlre-resource-manager official_bundle_cache_smoke -- --ignored

  cross-platform-core:
    name: 共用核心跨平台測試（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
