[package]
name = "wlre-resource-manager"
version = "0.2.0"
edition = "2021"

[dependencies]
wlre-core-observability = { path = "../core-observability" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
crc32fast = "1"
unity-bundle-assets = "=0.1.1"
